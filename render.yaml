# =====================================================================
# render.yaml  -  Render Blueprint for the marksheet-verifier BACKEND
# =====================================================================
# This deploys the FastAPI backend as a free-tier Render Web Service using the
# NATIVE PYTHON runtime. See docs/DEPLOYMENT_GUIDE.md for full instructions.
#
# IMPORTANT:
#   * No real secrets live here. Secret values use `sync: false` (you paste them
#     in the Render dashboard) or `generateValue: true` (Render generates them).
#   * The native Python runtime CANNOT install system tools (apt). The analyzer
#     needs Tesseract OCR + ExifTool (and OpenCV needs libGL). If OCR/forensics
#     fail on the native runtime, switch to the optional Docker fallback
#     (backend/Dockerfile) — see docs/DEPLOYMENT_GUIDE.md "Phase 11B".
#   * The frontend is deployed separately on Vercel (see frontend/vercel.json).
# ---------------------------------------------------------------------

services:
  - type: web
    name: marksheet-verifier-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Python version (also set by backend/runtime.txt) ---
      - key: PYTHON_VERSION
        value: 3.11.9

      # --- Database (paste your Supabase/Neon connection string) ----------
      - key: DATABASE_URL
        sync: false

      # --- Optional Claude API mode ---------------------------------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: LLM_ENABLED
        value: "false"          # set "true" in the dashboard once a key is added
      - key: LLM_MAX_TOKENS
        value: "900"

      # --- Authentication (JWT) -------------------------------------------
      - key: JWT_SECRET_KEY
        generateValue: true     # Render generates a strong random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"

      # --- One-time first-admin bootstrap secret --------------------------
      - key: SETUP_SECRET
        generateValue: true     # read it from the dashboard to call /auth/setup-admin

      # --- Deployment URLs / environment ----------------------------------
      # Set FRONTEND_URL after the Vercel deploy; BACKEND_URL to this service URL.
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ENVIRONMENT
        value: production

      # --- Upload limits --------------------------------------------------
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ALLOWED_UPLOAD_EXTENSIONS
        value: .pdf,.png,.jpg,.jpeg

      # --- Heavy image forensics (off on free tier; see DEPLOYMENT_GUIDE) --
      # The OpenCV forensics step is too heavy for the free 0.1-CPU instance
      # (it starves the health check and restarts the app mid-upload).
      - key: FORENSICS_ENABLED
        value: "false"
